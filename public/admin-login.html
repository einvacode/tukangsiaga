<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Login - Tukang Siaga</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { brand: { 50:'#eff6ff',100:'#dbeafe',500:'#3b82f6',600:'#2563eb',700:'#1d4ed8',800:'#1e40af' } } } } }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>*, *::before, *::after { font-family: 'Inter', sans-serif; box-sizing: border-box; }</style>
</head>
<body class="min-h-screen bg-slate-50 flex items-center justify-center p-4 antialiased">

    <div class="w-full max-w-sm">
        <!-- Logo -->
        <div class="flex flex-col items-center mb-8">
            <div class="h-14 w-14 rounded-2xl bg-brand-600 flex items-center justify-center text-white shadow-lg shadow-brand-200 mb-4">
                <i data-lucide="hammer" class="w-7 h-7"></i>
            </div>
            <h1 class="text-xl font-bold text-slate-900">Tukang<span class="text-brand-600">Siaga</span></h1>
            <p class="text-sm text-slate-500 mt-1">Portal Internal Staf</p>
        </div>

        <!-- Card -->
        <div class="rounded-2xl border border-slate-200 bg-white shadow-sm overflow-hidden">
            <!-- Card header accent -->
            <div class="h-1 bg-gradient-to-r from-brand-500 to-brand-700"></div>
            <div class="px-6 py-5 border-b border-slate-100">
                <h2 class="text-base font-bold text-slate-900">Masuk ke Dasbor</h2>
                <p class="text-xs text-slate-500 mt-0.5">Akses khusus staf internal TukangSiaga.</p>
            </div>
            <form id="loginForm" onsubmit="handleLogin(event)" class="px-6 py-5 space-y-4">
                <!-- Username -->
                <div class="space-y-1.5">
                    <label class="text-xs font-semibold text-slate-700 uppercase tracking-wide">Username</label>
                    <div class="relative">
                        <div class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400">
                            <i data-lucide="user" class="w-4 h-4"></i>
                        </div>
                        <input id="loginUsername" type="text" required autocomplete="username"
                            placeholder="Masukkan username Anda"
                            class="h-11 w-full rounded-lg border border-slate-200 bg-slate-50 pl-10 pr-4 text-sm text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent focus:bg-white transition">
                    </div>
                </div>

                <!-- Password -->
                <div class="space-y-1.5">
                    <label class="text-xs font-semibold text-slate-700 uppercase tracking-wide">Password</label>
                    <div class="relative">
                        <div class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400">
                            <i data-lucide="lock" class="w-4 h-4"></i>
                        </div>
                        <input id="loginPassword" type="password" required autocomplete="current-password"
                            placeholder="Masukkan password Anda"
                            class="h-11 w-full rounded-lg border border-slate-200 bg-slate-50 pl-10 pr-11 text-sm text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent focus:bg-white transition">
                        <button type="button" onclick="togglePwd()" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-700 transition-colors w-5 flex items-center justify-center">
                            <i id="pwdIcon" data-lucide="eye" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>

                <!-- Error box -->
                <div id="loginError" class="hidden rounded-lg border border-red-200 bg-red-50 px-3.5 py-3 text-sm text-red-700 flex items-center gap-2.5">
                    <i data-lucide="alert-circle" class="w-4 h-4 shrink-0"></i>
                    <span id="loginErrMsg"></span>
                </div>

                <!-- Submit -->
                <button type="submit" id="btnLogin"
                    class="w-full rounded-lg bg-brand-600 hover:bg-brand-700 active:bg-brand-800 py-3 text-sm font-bold text-white shadow-sm shadow-brand-200 transition-all disabled:opacity-60 disabled:cursor-not-allowed flex items-center justify-center gap-2">
                    <i data-lucide="log-in" class="w-4 h-4" id="btnIcon"></i> <span id="btnText">Masuk ke Dasbor</span>
                </button>
            </form>

            <!-- Hint akun -->
            <div class="px-6 pb-5">
                <div class="rounded-lg bg-brand-50 border border-brand-100 px-4 py-3">
                    <p class="text-xs font-semibold text-brand-700 mb-1 flex items-center gap-1"><i data-lucide="info" class="w-3 h-3"></i> Akun Default</p>
                    <p class="text-xs text-brand-600 font-mono">admin / admin123</p>
                </div>
            </div>
        </div>

        <p class="text-center text-xs text-slate-400 mt-6">
            &copy; 2026 TukangSiaga &bull;
            <a href="/" class="hover:text-slate-700 transition-colors">Kembali ke Beranda</a>
        </p>
    </div>

    <script>
        if (sessionStorage.getItem('ts_admin')) window.location.href = '/admin-dashboard.html';



        function togglePwd() {
            const inp  = document.getElementById('loginPassword');
            const icon = document.getElementById('pwdIcon');
            const show = inp.type === 'password';
            inp.type   = show ? 'text' : 'password';
            
            const parent = icon.parentNode;
            parent.innerHTML = '';
            const newIcon = document.createElement('i');
            newIcon.id = 'pwdIcon';
            newIcon.className = 'w-4 h-4';
            newIcon.setAttribute('data-lucide', show ? 'eye-off' : 'eye');
            parent.appendChild(newIcon);
            lucide.createIcons();
        }

        async function handleLogin(e) {
            e.preventDefault();
            const btn    = document.getElementById('btnLogin');
            const errBox = document.getElementById('loginError');
            const errMsg = document.getElementById('loginErrMsg');
            errBox.classList.add('hidden');

            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;

            if (!username || !password) {
                errMsg.textContent = 'Username dan password wajib diisi.';
                errBox.classList.remove('hidden');
                return;
            }

            const btnIcon = document.getElementById('btnIcon');
            const btnText = document.getElementById('btnText');
            btnIcon.setAttribute('data-lucide', 'loader-2');
            btnIcon.classList.add('animate-spin');
            btnText.textContent = 'Memverifikasi...';
            lucide.createIcons();
            btn.disabled  = true;

            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const d = await res.json();
                
                if (d.success) {
                    sessionStorage.setItem('ts_admin', JSON.stringify({ username:d.user.username, name:d.user.name, role:d.user.role }));
                    window.location.href = '/admin-dashboard.html';
                } else {
                    errMsg.textContent = d.message;
                    errBox.classList.remove('hidden');
                    document.getElementById('loginPassword').value = '';
                    document.getElementById('loginPassword').focus();
                    
                    btnIcon.setAttribute('data-lucide', 'log-in');
                    btnIcon.classList.remove('animate-spin');
                    btnText.textContent = 'Masuk ke Dasbor';
                    lucide.createIcons();
                    btn.disabled  = false;
                }
            } catch (err) {
                errMsg.textContent = 'Gagal terhubung ke server.';
                errBox.classList.remove('hidden');
                btnIcon.setAttribute('data-lucide', 'log-in');
                btnIcon.classList.remove('animate-spin');
                btnText.textContent = 'Masuk ke Dasbor';
                lucide.createIcons();
                btn.disabled  = false;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            document.getElementById('loginUsername').focus();
        });
    </script>
</body>
</html>
